name: Build Daily Discipline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output_apk/DailyDiscipline.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/DailyDiscipline.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyDiscipline-APK
          path: output_apk/DailyDiscipline.apk

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-app
          name: "Daily Discipline v1.0.0 Mobile APK"
          body: |
            ## 🔥 Daily Discipline Tracker — Android Mobile App (v1.0.0)

            ### 🚀 Performance & Memory Features:
            - **Ultra-Low Memory:** ~25MB–35MB RAM (zero phone slowdown, 0MB background memory).
            - **Instant 0ms Startup:** Offline-ready, launches instantly even in airplane mode.
            - **⏰ Ring Alarm & Reminders:** Native Android AlarmManager rings sound & vibration at **09:00 AM** and **09:00 PM IST**.
            - **Android Back Button:** Closes popups and sidebars smoothly.
            - **Cyberpunk Dark Theme:** Seamless `#0a0b12` status bar.

            ### 📲 Direct Download:
            Download **[DailyDiscipline.apk](https://github.com/Akashcc702/PKI-TRACKER_Notification/releases/download/v1.0.0-app/DailyDiscipline.apk)** directly to your Android device.

            ### 💻 Install via ADB (USB Cable):
            ```bash
            adb install -r DailyDiscipline.apk
            ```
          files: |
            output_apk/DailyDiscipline.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}